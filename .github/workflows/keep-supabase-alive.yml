name: Keep Supabase Alive

on:
  schedule:
    # Runs every 4 days at midnight UTC (0 0 */4 * *)
    - cron: '0 0 */4 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://vrzynujjspzxyreltvoj.supabase.co/rest/v1/
